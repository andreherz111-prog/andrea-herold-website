<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Formular-Vorlage</title></head>
<body>
<!-- Vorlage, damit Netlify das Formular „anfrage“ erkennt. Das echte Formular steht auf /kontakt/. -->
<form name="anfrage" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="anfrage">
  <input name="bot-field">
  <input name="name">
  <input name="kontakt">
  <select name="anliegen"><option value="ich"></option><option value="kind"></option><option value="anderes"></option></select>
  <textarea name="nachricht"></textarea>
  <input type="checkbox" name="einwilligung" value="ja">
</form>
</body>
</html>
